<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>빼빼로 메이트</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff7fb5;--pink-d:#e0438a;--pink-l:#ffd6e8;--ink:#5a1638;--cream:#fff6fb;--sub:#a0457a}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{
  background-color:#ffc2dd;
  background-image:radial-gradient(circle at 18px 18px,#fff 0 4px,transparent 5px),radial-gradient(circle at 58px 52px,#ff9cc8 0 6px,transparent 7px);
  background-size:80px 80px;color:var(--ink);
  font-family:"Noto Sans KR","Noto Sans TC",sans-serif;
  display:flex;align-items:center;justify-content:center;padding:16px;
}
.win{margin:auto;width:100%;max-width:440px;background:var(--cream);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
.bar{background:linear-gradient(90deg,var(--pink),#ffa6d1);color:#fff;font-family:"Press Start 2P",monospace;font-size:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--ink)}
.bar button{background:#fff;color:var(--ink);border:2px solid var(--ink);font:inherit;font-size:8px;padding:4px 6px;cursor:pointer}
.stage{position:relative;height:270px;overflow:hidden;border-bottom:4px solid var(--ink);background:linear-gradient(#ffe3f0,#ffc7e2)}
.stage.bg-cafe{background:linear-gradient(#fff0c9,#ffd1e6)}
.stage.bg-sea{background:linear-gradient(#cfeeff 0%,#ffd6ea 75%)}
.stage.bg-night{background:linear-gradient(#d9c7ff,#ffc7e2)}
.stage.rain::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.7;background:repeating-linear-gradient(100deg,transparent 0 14px,rgba(255,255,255,.9) 14px 16px);animation:fall .7s linear infinite}
@keyframes fall{from{background-position:0 0}to{background-position:-16px 40px}}
.sparkle{position:absolute;font-family:"Press Start 2P";font-size:12px;color:#fff;text-shadow:2px 2px 0 var(--pink-l);animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.char{position:absolute;bottom:0;width:170px;height:227px;background-repeat:no-repeat;background-size:200% auto;mix-blend-mode:multiply;transition:transform .25s,opacity .25s,filter .25s}
.char.hu{left:0;background-position:0 0}
.char.mi{right:0;background-position:100% 0}
.look-school .char,.look-casual .char{background-image:url("img/main.png")}
#stageCg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:rgba(255,214,232,.96);z-index:2;border:0}
.char.dim{opacity:.45;filter:saturate(.5)}
.char.speak{transform:translateY(-6px)}
.bub{position:absolute;top:4px;left:50%;transform:translateX(-50%);font-family:"Press Start 2P";font-size:14px;color:var(--pink-d);text-shadow:1px 1px 0 #fff}
.hud{position:relative;padding:10px 14px;border-bottom:4px solid var(--ink);background:#fff0f7}
.hud-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;margin-bottom:6px}
.hud-top .num{font-family:"Press Start 2P";font-size:10px;color:var(--pink-d)}
.meter{display:flex;gap:4px;align-items:flex-end;height:38px}
.meter svg{width:14px;height:36px;transition:opacity .3s,transform .3s}
.meter svg.off{opacity:.22}
.meter svg.on{transform:translateY(-2px)}
.meter .cut{width:2px;height:40px;background:var(--pink-d);margin:0 4px;opacity:.6}
.fx{position:absolute;right:14px;top:10px;font-family:"Press Start 2P";font-size:10px;color:var(--pink-d);opacity:0;transition:opacity .4s,transform .4s;pointer-events:none}
.fx.show{opacity:1;transform:translateY(-8px)}
.box{padding:14px 16px 12px;min-height:170px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;padding:5px 8px;margin-bottom:10px}
.tag .tk{font-family:"Press Start 2P";font-size:9px;font-weight:400}
.tag .tz{font-size:10px;opacity:.85}
.tag.os{background:#fff;color:var(--ink);border:2px dashed var(--ink)}
.zh{display:block;font-size:10px;line-height:1.5;color:var(--sub);font-weight:400;min-height:1.5em;margin-top:6px;opacity:.9}
.ko{display:block;font-size:19px;line-height:1.5;font-weight:900;color:var(--ink);word-break:keep-all}
.ko.os{font-weight:700}
.ko.os::before{content:"♥ ";color:var(--pink-d)}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.choice{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:9px 12px;font:inherit;cursor:pointer}
.choice:hover,.choice:focus-visible{background:var(--pink-l);outline:none;transform:translate(-1px,-1px)}
.choice .k{display:block;font-size:16px;font-weight:700;color:var(--ink);line-height:1.45}
.choice .z{display:block;font-size:10px;color:var(--sub);margin-top:4px;line-height:1.45;padding-top:4px;border-top:1px dashed #e7a9c8}
.foot{padding:0 16px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hint{font-size:10px;color:var(--sub)}
.btn{background:var(--pink);color:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-family:"Press Start 2P";font-size:10px;padding:10px 12px;cursor:pointer}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.snd{background:#fff;color:var(--ink);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);font-family:"Press Start 2P";font-size:8px;padding:4px 6px;cursor:pointer;margin-left:8px}
.snd.off{background:var(--pink-l);color:var(--sub)}
.bar-btns{display:flex;gap:6px;align-items:center}
.bar-btns button.off{background:var(--pink-l);color:var(--sub)}
/* 語言切換：只顯示選定的語言 */
body.lang-ko .lz,body.lang-ko .zh,body.lang-ko .choice .z{display:none}
body.lang-zh .lk,body.lang-zh .ko,body.lang-zh .choice .k{display:none}
body.lang-zh .zh{display:block;font-size:19px;line-height:1.5;font-weight:900;color:var(--ink);margin-top:0;min-height:1.5em}
body.lang-zh .choice .z{display:block;font-size:16px;font-weight:700;color:var(--ink);line-height:1.45;margin-top:0;padding-top:0;border-top:none}
body.lang-zh .ko.os{display:none}
body.lang-zh .zh.os{font-weight:700}
body.lang-zh .zh.os::before{content:"♥ ";color:var(--pink-d)}
#cg{position:fixed;inset:0;background:rgba(255,192,221,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;z-index:10;cursor:pointer}
#cg img{max-width:100%;max-height:72vh;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);background:#fff}
#cg .cgtxt{font-family:"Press Start 2P";font-size:9px;color:var(--ink);background:#fff;border:2px solid var(--ink);padding:6px 8px}
[hidden]{display:none !important}
@media (prefers-reduced-motion:reduce){.stage.rain::before,.sparkle{animation:none}}
</style>
</head>
<body>
<div class="win">
  <div class="bar">
    <span>🥢</span>
    <div class="bar-btns">
      <button id="sndBtn" type="button">♪ ON</button>
      <button id="langBtn" type="button">KO</button>
      <button id="menuBtn" type="button" hidden>MENU</button>
    </div>
  </div>

  <div class="stage look-casual bg-cafe" id="stage">
    <div class="sparkle" style="left:16px;top:14px">✦</div>
    <div class="sparkle" style="right:20px;top:40px;animation-delay:.6s">✦</div>
    <div class="char hu" id="hu"><span class="bub" id="hub"></span></div>
    <div class="char mi" id="mi"><span class="bub" id="mib"></span></div>
    <img id="stageCg" alt="" hidden>
  </div>

  <div class="hud">
    <div class="hud-top">
      <span><span class="lk">친밀도</span><span class="lz">親密值</span></span>
      <span class="num"><span id="pepNum">0</span>/8</span>
    </div>
    <div class="meter" id="meter"></div>
    <div class="fx" id="fx"></div>
  </div>

  <div class="box">
    <div id="tag" class="tag"></div>
    <span id="ko" class="ko"></span>
    <span id="zh" class="zh"></span>
    <div id="choices" class="choices" hidden></div>
  </div>

  <div class="foot">
    <span class="hint" id="hint"></span>
    <button id="next" class="btn" type="button">NEXT ▶</button>
  </div>
</div>

<div id="cg" hidden>
  <img id="cgimg" alt="">
  <div class="cgtxt">TAP TO CONTINUE</div>
</div>

<script>
// ============ helpers ============
const $ = id => document.getElementById(id);
const KISS  = 'img/kiss.png';   // 集滿 CG
const ANGRY = 'img/angry.png';  // 0–3 根結局 CG
const MID   = 'img/mid.png';    // 4–7 根結局 CG
const clamp = n => Math.max(0, Math.min(8, n));

const N  = (zh,ko) => ({s:'n',   zh, ko});       // 旁白
const H  = (zh,ko) => ({s:'hu',  zh, ko});       // 후후 說話
const M  = (zh,ko) => ({s:'mi',  zh, ko});       // 만재 說話
const HO = (zh,ko) => ({s:'hos', zh, ko});       // 후후 內心
const MO = (zh,ko) => ({s:'mos', zh, ko});       // 만재 內心
const C  = (d,zh,ko,reply) => ({d, zh, ko, reply}); // 選項：d = 2 / 1 / 0 根

// ============ 劇本 ============
const STORIES = {
  rain:{
    label:{zh:'下雨', ko:'비'}, bg:'bg-night', rain:true,
    scenes:[
      {look:'school', lines:[
        N('下午四點，突然下起大雨。學校只剩財財一個人。','오후 네 시, 갑자기 비가 쏟아졌다. 학교에 만재 혼자 남아 있다.'),
        H('財財，你有傘嗎？','만재야, 우산 있어?'),
        M('……沒有，沒關係。','……없어, 괜찮아.')],
       choices:[
        C(2,'「我們一起撐！我的傘很大！」','“같이 쓰자! 내 우산 엄청 커.”', [MO('(這個人怎麼總是先注意到我。)','(이 사람은 왜 늘 먼저 알아차리지.)')]),
        C(1,'「傘給你，你先拿去。」','“우산 줄게, 먼저 가져가.”', [MO('(謝謝，可是你要怎麼辦。)','(고마워, 근데 너는 어떡하려고.)')]),
        C(0,'「那我先走囉～」','“그럼 나 먼저 갈게~”', [MO('(就這樣走了，有點失落。)','(그냥 가 버리네. 조금 서운하다.)')])]},
      {look:'school', lines:[
        N('傘還是太小了，肩膀慢慢被淋濕。','우산이 여전히 너무 작아서 어깨가 조금씩 젖고 있다.'),
        HO('(你的肩膀，全都濕了吧。)','(저 어깨, 다 젖었잖아.)')],
       choices:[
        C(2,'「傘往這邊傾！我沒關係！」','“우산 이쪽으로 기울여! 난 괜찮아!”', [MO('(自己淋濕還幫我擋雨，傻瓜)','(자기가 젖으면서 나를 가려 주다니, 바보같이.)')]),
        C(1,'「肩膀濕了，靠近一點！」','“어깨 젖었어, 좀 더 가까이 와!”', [MO('(可以靠近一點嗎……)','(좀 더 가까이 가도 되는 걸까……)')]),
        C(0,'「傘好小 哈哈。」','“우산 엄청 작다, 하하.”', [MO('(要買新的雨傘嗎？)','(새 우산 사야 하나?)')])]},
      {look:'casual', lines:[
        N('公車來了，財財先開口。','버스가 왔다. 만재가 먼저 입을 열었다.'),
        M('我坐後面那班。','나 뒤에 오는 버스 탈래.'),
        HO('(想一起走，卻說不出口。)','(같이 가고 싶은데 말을 못 하겠어.)')],
       choices:[
        C(2,'「那我也等後面那班，一起走。」','“그럼 나도 뒤에 오는 버스 기다릴게. 같이 가자.”', [MO('(說要一起等，心情好奇怪。)','(같이 기다려 준다니, 기분이 이상해.)')]),
        C(1,'「嗯，那我等你的公車來！」','“응, 그럼 네 버스 올 때까지 기다릴게!”', [MO('(其實希望可以一起搭。)','(사실은 같이 탔으면 좋겠다.)')]),
        C(0,'「那我自己去！」','“그럼 나 혼자 갈래!”', [MO('(回頭看了一眼，有點擔心。)','(뒤돌아보는 거 봤어. 조금 걱정된다.)')])]},
      {look:'casual', lines:[
        N('財財輕輕打了個噴嚏。','만재가 살짝 재채기를 했다.'),
        M('……我不冷。','……안 추워.'),
        H('不冷？鼻子都紅了耶。','안 춥다면서, 코 빨갛잖아.')],
       choices:[
        C(2,'「穿我的外套，會很暖。」','“내 외투 입어. 따뜻할 거야.”', [MO('(味道很好。)','(냄새 좋다.)')]),
        C(1,'「要不要買熱可可？」','“따뜻한 코코아 사 줄까?”', [MO('(可可…… 其實我喜歡。)','(코코아… 사실 좋아하는데.)')]),
        C(0,'「感冒了我會很無聊耶。」','“감기 걸리면 나 심심해지잖아.”', [MO('(這樣說，會讓我疑惑。)','(이렇게 말하면 헷갈리잖아.)')])]},
      {look:'casual', lines:[
        N('雨停了。','비가 그쳤다.'),
        M('傘，明天還你。','우산, 내일 돌려줄게.')],
       choices:[
        C(2,'「下次下雨一起用吧。」','“다음에 비 오면 같이 쓰자.”', [MO('(下次一起用嗎……)','(다음에 같이 쓰자고……?)')]),
        C(1,'「好，別忘了喔！」','“그래, 잊으면 안 돼!”', [MO('(怎麼可能忘。)','(잊을 리가 없잖아.)')]),
        C(0,'「直接拿走也可以啊，很麻煩耶。」','“그냥 가져도 되는데, 귀찮잖아.”', [MO('(對不起)','(미안해.)')])]}
    ],
    endings:{
      good:{lines:[N('那天之後，只要下雨，兩人總是共用同一把傘。','그날 이후로 비가 오면 두 사람은 늘 우산 하나를 같이 썼다.'), MO('(未來一起淋雨的話，很像也不錯。)','(앞으로 같이 비 맞으면, 그것도 좋을 것 같아.)')]},
      mid:{lines:[M('傘還沒還。明天放在書桌上吧。','우산 아직 못 돌려줬어. 내일 책상 위에 올려 둘게.')]},
      low:{lines:[N('雨停了，兩人各自撐著傘走了。','비가 그쳤고, 두 사람은 각자 우산을 쓰고 걸어갔다.'), MO('(怎麼辦)','(어떡하지.)')]}
    }
  },

  pork:{
    label:{zh:'五花肉', ko:'삼겹살'}, bg:'bg-cafe',
    scenes:[
      {look:'casual', lines:[
        N('烤肉店，熏熏把五花肉烤得金黃。財財只夾生菜，不碰肉。','고깃집에서 후후가 삼겹살을 노릇하게 구웠다. 만재는 상추만 집고 고기에는 손대지 않았다.'),
        H('財財，五花肉要包生菜才好吃！','만재야, 삼겹살은 상추에 싸 먹어야 맛있어!'),
        MO('(？)','(？)')],
       choices:[
        C(2,'「我幫你包！張嘴！」','“내가 싸 줄게! 입 벌려!”', [MO('(不先說一聲就這樣，會嚇到的。不過……很好吃。)','(말도 없이 이러면 놀라잖아. 근데… 맛있다.)')]),
        C(1,'「生菜要不要一起包？」','“상추 같이 싸 줄까?”', [MO('(……可以拜託你嗎。)','(……부탁해도 될까.)')]),
        C(0,'「要吃肉啦，笨蛋。」','“고기 좀 먹어, 바보야.”', [MO('(笨蛋？)','(바보라니…)')])]},
      {look:'casual', lines:[
        N('有一片肉烤焦了，黑黑的。','고기 한 점이 새까맣게 탔다.'),
        N('財財拿走了這一塊。','만재가 그 점을 가져갔다.')],
       choices:[
        C(2,'「焦的不健康，丟掉吧！」','“탄 건 몸에 안 좋아. 버리자!”', [MO('(謝謝你)','(고마워.)')]),
        C(1,'「這塊我吃！」','“이건 내가 먹을게!”', [MO('(吃焦的，肚子會痛吧。)','(탄 걸 먹으면 배 아플 텐데.)')]),
        C(0,'「這是財財烤的吧？」','“이거 만재가 구운 거지?”', [MO('(……是我烤的沒錯。)','(……맞아, 내가 구웠어.)')])]},
      {look:'casual', lines:[
        N('最後一片肉。財財拿起夾子，又輕輕放進熏熏的碗裡。','마지막 고기 한 점. 만재가 집게를 들었다가 후후의 그릇에 살며시 옮겨 놓았다.'),
        HO('(……這是要給我的嗎？)','(……이거 나 주는 거야?)')],
       choices:[
        C(2,'「你也要吃，我幫你烤！」','“너도 먹어. 내가 구워 줄게!”', [MO('(一起吃，很好。)','(같이 먹으니까 좋다.)')]),
        C(1,'「為什麼給我？」','“왜 나 줘?”', [MO('(五花肉你的最愛。)','(삼겹살은 네가 제일 좋아하잖아.)')]),
        C(0,'「肉我全部要吃掉！」','“고기는 내가 다 먹을 거야!”', [MO('(有點可愛……)','(좀 귀엽기도 하고……)')])]},
      {look:'casual', lines:[
        N('財財的耳朵紅紅的。','만재의 귀가 빨갛다.'),
        M('……是火太熱了。','……불 때문에 더워서 그래.')],
       choices:[
        C(2,'「對啊，是火的關係。我也紅了。」','“응, 불 때문이지. 나도 빨개졌어.”', [MO('(我看看。)','(어디 보자.)')]),
        C(1,'「耳朵紅紅的，都被看到了。」','“귀가 빨간 거 다 보여.”', [MO('(……被發現了。)','(……들켰네.)')]),
        C(0,'「你的臉像番茄耶！」','“너 얼굴이 토마토 같아!”', [MO('(竟然說我像番茄。)','(나더러 토마토 같다니.)')])]},
      {look:'casual', lines:[
        N('結帳時，財財先拿出了錢包。','계산할 때, 만재가 먼저 지갑을 꺼냈다.'),
        M('……這次我請。','……이번엔 내가 살게.')],

// ============ state ============
let key=null, si=0, lines=[], li=0, phase='menu', pep=0, cgCb=null, endDone=false;

// ============ rendering ============
function renderMeter(){
  const slots = Array.from({length:10},(_,i)=>{
    const on = i < pep;
    const svg = `<svg viewBox="0 0 14 36" class="${on?'on':'off'}" aria-hidden="true">
      <rect x="3" y="0" width="8" height="36" rx="2" fill="#f3d19c" stroke="#5a1638" stroke-width="1.5"/>
      <rect x="3" y="0" width="8" height="12" rx="2" fill="#6b3a22" stroke="#5a1638" stroke-width="1.5"/></svg>`;
    return i===8 ? `<span class="cut"></span>${svg}` : svg;
  });
  $('meter').innerHTML = slots.join('');
  $('pepNum').textContent = pep;
  $('hint').innerHTML = pep>=8 ? '<span class="lk">가득 찼어!</span><span class="lz">集滿！</span>' : '';
}
function flash(text){
  const f=$('fx'); f.textContent=text; f.classList.remove('show'); void f.offsetWidth; f.classList.add('show');
}
function setSpeaker(s){
  $('hu').classList.toggle('dim', !['hu','hos','n'].includes(s));
  $('mi').classList.toggle('dim', !['mi','mos','n'].includes(s));
  $('hu').classList.toggle('speak', s==='hu'||s==='hos');
  $('mi').classList.toggle('speak', s==='mi'||s==='mos');
}
function setBubble(s){
  $('hub').textContent = (s==='hos') ? '♥' : '';
  $('mib').textContent = (s==='mos') ? '♥' : '';
}
function setText(zh, ko, os){
  $('zh').textContent = zh;
  $('ko').textContent = ko;
  $('ko').className = os ? 'ko os' : 'ko';
}
function drawLine(L){
  const tag = $('tag');
  if(L.s==='hu'){ tag.className='tag'; tag.innerHTML='<b class="tk lk">후후</b><span class="tz lz">熏熏</span>'; }
  else if(L.s==='mi'){ tag.className='tag'; tag.innerHTML='<b class="tk lk">만재</b><span class="tz lz">財財</span>'; }
  else if(L.s==='hos'){ tag.className='tag os'; tag.innerHTML='<b class="tk lk">후후 OS</b><span class="tz lz">內心</span>'; }
  else if(L.s==='mos'){ tag.className='tag os'; tag.innerHTML='<b class="tk lk">만재 OS</b><b class="tk lz">OS</b>'; }
  else { tag.className='tag'; tag.innerHTML='<b class="tk">NARRATION</b>'; }
  setText(L.zh, L.ko, L.s==='hos'||L.s==='mos');
  setSpeaker(L.s); setBubble(L.s);
  $('choices').hidden = true;
  $('next').hidden = false;
  $('next').textContent = 'NEXT ▶';
}
function showChoices(list){
  const isLast = si === STORIES[key].scenes.length - 1;
  const tag=$('tag');
  if(isLast){
    tag.className='tag'; tag.innerHTML='<b class="tk">LAST</b>';
    setText('最後一題！熏熏要怎麼做？','마지막 질문! 후후는 어떻게 할까?', false);
  } else {
    tag.className='tag'; tag.innerHTML='<b class="tk">CHOOSE</b>';
    setText('熏熏要怎麼做？','후후는 어떻게 할까?', false);
  }
  setSpeaker('hu'); setBubble('');
  $('next').hidden = true;
  const wrap=$('choices'); wrap.innerHTML='';
  const order = list.slice();
  for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  order.forEach(item=>{
    const b=document.createElement('button');
    b.className='choice'; b.type='button';
    b.innerHTML = `<span class="k">${item.ko}</span><span class="z">${item.zh}</span>`;
    b.onclick = () => pick(item);
    wrap.appendChild(b);
  });
  wrap.hidden=false;
}
function showCG(src, cb){
  $('cgimg').src = src;
  $('cg').hidden = false;
  cgCb = cb;
}
$('cg').onclick = () => {
  $('cg').hidden = true;
  const cb = cgCb; cgCb = null;
  if(cb) cb();
};

// ============ BGM ============
const bgm = new Audio('audio/bgm.mp3');
bgm.loop = true; bgm.volume = 0.35;
let musicOn = true;
function playBgm(){ if(musicOn && bgm.paused) bgm.play().catch(()=>{}); }
function renderSnd(){
  const b=$('sndBtn'); b.textContent = musicOn ? '♪ ON' : '♪ OFF';
  b.classList.toggle('off', !musicOn);
}
function toggleSound(){
  musicOn = !musicOn;
  if(musicOn) playBgm(); else bgm.pause();
  renderSnd();
}
// 瀏覽器需要使用者操作後才能播放音樂，所以第一次點畫面時開始播
document.addEventListener('pointerdown', playBgm);
$('sndBtn').addEventListener('click', e => { e.stopPropagation(); toggleSound(); });
renderSnd();

let LANG = 'ko';
function renderLang(){
  document.body.className = 'lang-' + LANG;
  $('langBtn').textContent = LANG === 'ko' ? 'KO' : '中';
}
$('langBtn').addEventListener('click', e => {
  e.stopPropagation();
  LANG = LANG === 'ko' ? 'zh' : 'ko';
  renderLang();
});
renderLang();

function showMenu(){
  key=null; phase='menu'; endDone=false;
  $('stageCg').hidden = true;
  $('stage').className='stage look-casual bg-cafe';
  setSpeaker('n'); setBubble('');
  $('menuBtn').hidden = true;
  $('next').hidden = true;
  $('hint').textContent = '';
  const tag=$('tag'); tag.className='tag'; tag.innerHTML='<b class="tk">MENU</b>';
  setText('選一個情境', '상황을 고르세요', false);
  const wrap=$('choices'); wrap.innerHTML='';
  Object.entries(STORIES).forEach(([k,st])=>{
    const b=document.createElement('button');
    b.className='choice'; b.type='button';
    b.innerHTML = `<span class="k">${st.label.ko}</span><span class="z">${st.label.zh}</span>`;
    b.onclick = () => startStory(k);
    wrap.appendChild(b);
  });
  wrap.hidden=false;
}
function startStory(k){
  key=k; pep=0; si=0;
  renderMeter();
  $('menuBtn').hidden = false;
  startScene();
}
function startScene(){
  $('stageCg').hidden = true;
  const st = STORIES[key];
  const sc = st.scenes[si];
  $('stage').className = `stage look-${sc.look} ${st.bg||''} ${st.rain?'rain':''}`;
  lines = sc.lines; li=0; phase='lines';
  show();
}
function pick(c){
  $('choices').hidden = true;
  pep = clamp(pep + c.d);
  renderMeter();
  lines = c.reply; li=0; phase='reply'; show();
}
function finish(){
  $('stageCg').hidden = true;
  const st = STORIES[key];
  const kind = pep>=8 ? 'good' : pep>=4 ? 'mid' : 'low';
  const E = st.endings[kind];
  const go = () => { lines = E.lines; li=0; phase='end'; show(); };
  if(kind==='good'){ showCG(KISS, go); }
  else if(kind==='mid'){ showCG(MID, go); }
  else { showCG(ANGRY, go); }
}
function showEndControls(){
  endDone = true;
  $('next').hidden = false;
  $('next').textContent = 'MENU ▶';
  $('hint').innerHTML = `<span class="lk">친밀도 ${pep}/8</span><span class="lz">親密值 ${pep}/8</span>`;
  setBubble('');
  $('choices').hidden = true;
}
function show(){
  if(phase==='menu') return;
  const st = STORIES[key];
  const sc = st.scenes[si];

  if(phase==='lines'){
    if(li < lines.length){ drawLine(lines[li]); return; }
    if(sc.choices){ phase='choose'; showChoices(sc.choices); return; }
  }
  if(phase==='reply'){
    if(li < lines.length){ drawLine(lines[li]); return; }
    si++;
    if(si < st.scenes.length){ startScene(); return; }
    finish(); return;
  }
  if(phase==='end'){
    if(li < lines.length){ drawLine(lines[li]); return; }
    showEndControls(); return;
  }
}
$('next').onclick = () => {
  if(endDone){ showMenu(); return; }
  if(phase==='lines' || phase==='reply' || phase==='end'){ li++; show(); }
};
$('menuBtn').onclick = () => { renderMeter(); showMenu(); };

renderMeter();
showMenu();
</script>
</body>
