<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>mmgame</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2a5c;--pink:#ff7fb5;--pink-d:#e0438a;--blue:#7cc8f2;--blue-d:#2f95d1;--cream:#fffaff}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{
  background-color:#e3d4ff;
  background-image:
    radial-gradient(circle at 20px 20px,#fff 0 3px,transparent 4px),
    radial-gradient(circle at 60px 56px,#ffb3d9 0 5px,transparent 6px),
    radial-gradient(circle at 100px 24px,#a9dcf7 0 4px,transparent 5px);
  background-size:120px 80px;
  color:var(--ink);font-family:"Noto Sans KR","Noto Sans TC",sans-serif;
  display:flex;padding:16px;-webkit-tap-highlight-color:transparent;
}
.win{margin:auto;width:100%;max-width:440px;background:var(--cream);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
.bar{background:linear-gradient(90deg,var(--pink),#c9a6f5 50%,var(--blue));color:#fff;font-family:"Press Start 2P",monospace;font-size:9px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--ink)}
.bar button{background:#fff;color:var(--ink);border:2px solid var(--ink);font:inherit;font-size:8px;padding:4px 6px;cursor:pointer}
.dots{display:flex;gap:5px}
.dots i{width:10px;height:10px;border:2px solid var(--ink);background:#fff}
.dots i:nth-child(1){background:var(--pink)}.dots i:nth-child(2){background:#ffe58a}.dots i:nth-child(3){background:var(--blue)}

.hero{position:relative;text-align:center;padding:30px 12px 24px;border-bottom:4px solid var(--ink);background:linear-gradient(180deg,#ffe3f1,#e6f4ff);overflow:hidden}
.hero h1{margin:0;font-family:"Press Start 2P",monospace;font-weight:400;line-height:1.5;font-size:24px;color:#fff;
  -webkit-text-stroke:0;text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),5px 5px 0 var(--pink-d)}
.hero h1 b{display:block;font-weight:400;font-size:30px;color:#bfe6ff;text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),5px 5px 0 var(--blue-d)}
.hero p{margin:14px 0 0;font-size:13px;font-weight:700;color:#7a5aa6}
.star{position:absolute;color:#fff;text-shadow:0 0 0 var(--ink);font-size:18px;animation:tw 1.6s steps(2) infinite}
.star:nth-of-type(1){left:8%;top:14%;color:var(--pink)}
.star:nth-of-type(2){right:9%;top:20%;color:var(--blue-d);animation-delay:.4s}
.star:nth-of-type(3){left:14%;bottom:12%;color:#ffd24d;animation-delay:.8s;font-size:14px}
.star:nth-of-type(4){right:15%;bottom:16%;color:var(--pink-d);animation-delay:1.1s;font-size:13px}
@keyframes tw{50%{opacity:.25;transform:scale(.7)}}
.tick{border-bottom:4px solid var(--ink);background:var(--ink);color:#fff;font-family:"Press Start 2P",monospace;font-size:8px;white-space:nowrap;overflow:hidden;padding:7px 0}
.tick span{display:inline-block;padding-left:100%;animation:mq 14s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}

.list{padding:18px 16px 8px;display:grid;gap:18px}
.card{display:block;text-decoration:none;color:inherit;border:4px solid var(--ink);background:#fff;box-shadow:5px 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.card:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.thumb{position:relative;height:130px;overflow:hidden;border-bottom:4px solid var(--ink)}
.t1{background:linear-gradient(#fff0c9,#ffd1e6)}
.t1 i{position:absolute;inset:0;background:url("../img/main.png") center 38%/auto 150% no-repeat;mix-blend-mode:multiply}
.t2{background:linear-gradient(#fff6d8,#cfeafa);display:flex;justify-content:center}
.t2 img{height:150%;margin-top:-34px;mix-blend-mode:multiply}
.t2 u{position:absolute;left:50%;top:99px;width:54px;height:5px;margin-left:-27px;background:#5f4039;border-radius:2px;border-right:9px solid #e9c58f}
.no{position:absolute;left:8px;top:8px;background:var(--ink);color:#fff;font-family:"Press Start 2P",monospace;font-size:8px;padding:5px 6px}
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px}
.meta h2{margin:0;font-size:20px;font-weight:900;line-height:1.2}
.meta p{margin:4px 0 0;font-size:12px;color:#7a6a92}
.play{flex:none;font-family:"Press Start 2P",monospace;font-size:10px;color:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:10px 10px}
.c1 .play{background:var(--pink)}.c2 .play{background:var(--blue-d)}
.c1 h2{color:var(--pink-d)}.c2 h2{color:var(--blue-d)}
.foot{text-align:center;font-family:"Press Start 2P",monospace;font-size:7px;color:#9a86bd;padding:14px 0 16px}
body.lang-ko .lz{display:none}
body.lang-zh .lk{display:none}
@media (prefers-reduced-motion:reduce){.star,.tick span{animation:none}.tick span{padding-left:12px}}
</style>
</head>
<body class="lang-ko">
<main class="win">
  <div class="bar">
    <span class="dots"><i></i><i></i><i></i></span>
    <button id="langBtn" type="button">KO</button>
  </div>

  <header class="hero">
    <span class="star">✦</span><span class="star">✦</span><span class="star">★</span><span class="star">♥</span>
    <h1>myongmin<b>game</b></h1>
    <p><span class="lk">게임을 골라 주세요</span><span class="lz">選一個遊戲來玩吧</span></p>
  </header>
  <div class="tick"><span>★ WELCOME TO MYONGMIN GAME ★ SELECT GAME ★ PRESS PLAY ★ HAVE FUN ♥</span></div>

  <nav class="list">
    <a class="card c1" href="https://4nd2p7t7s9-ux.github.io/pepero-mate/">
      <div class="thumb t1"><i></i><span class="no">GAME 01</span></div>
      <div class="meta">
        <div>
          <h2><span class="lk">빼빼로 메이트</span><span class="lz">Pepero Mate</span></h2>
          <p><span class="lk">스토리 게임 · 빼빼로 8개 모으기</span><span class="lz">劇情遊戲・集滿 8 根 pepero</span></p>
        </div>
        <span class="play">PLAY▶</span>
      </div>
    </a>
    <a class="card c2" href="https://4nd2p7t7s9-ux.github.io/pepero-mate/game/">
      <div class="thumb t2"><img src="../game/img/left.png" alt=""><img src="../game/img/right.png" alt=""><u></u><span class="no">GAME 02</span></div>
      <div class="meta">
        <div>
          <h2><span class="lk">빼빼로 게임</span><span class="lz">Pepero 遊戲</span></h2>
          <p><span class="lk">타이밍 게임 · 0cm에 도전</span><span class="lz">時機遊戲・挑戰 0cm</span></p>
        </div>
        <span class="play">PLAY▶</span>
      </div>
    </a>
  </nav>
  <div class="foot">♥ MMGAME ♥</div>
</main>
<script>
let LANG = 'ko';
document.getElementById('langBtn').onclick = function () {
  LANG = LANG === 'ko' ? 'zh' : 'ko';
  document.body.className = 'lang-' + LANG;
  this.textContent = LANG === 'ko' ? 'KO' : '中';
};
</script>
</body>
</html>
